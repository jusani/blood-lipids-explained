  flag_fh_by_ldl_card:
    en: { self: "Guidelines suggest talking to a doctor when LDL is 4.9 mmol/L or higher. Yours is {ldl}. Doctors see this often and know how to help.", helper: "Guidelines suggest talking to a doctor when LDL is 4.9 mmol/L or higher. Theirs is {ldl}. Doctors see this often and know how to help." }
    lt: { self: "Gairės siūlo pasitarti su gydytoju, kai MTL yra 4,9 mmol/l ar daugiau. Jūsų rezultatas: {ldl}. Gydytojai su tuo susiduria dažnai ir žino, kaip padėti.", helper: "Gairės siūlo pasitarti su gydytoju, kai MTL yra 4,9 mmol/l ar daugiau. Šio žmogaus rezultatas: {ldl}. Gydytojai su tuo susiduria dažnai ir žino, kaip padėti." }
  flag_ldl_high_on_medicine_card:
    en: { self: "Your LDL is {ldl}, at or above the 4.9 mmol/L level where guidelines suggest talking to a doctor. Bring this to your doctor, and keep taking your medicine as prescribed.", helper: "Their LDL is {ldl}, at or above the 4.9 mmol/L level where guidelines suggest talking to a doctor. They can bring this to their doctor and keep taking their medicine as prescribed." }
    lt: { self: "Jūsų MTL yra {ldl}: tai siekia arba viršija 4,9 mmol/l lygį, nuo kurio gairės siūlo pasitarti su gydytoju. Aptarkite tai su gydytoju ir toliau vartokite vaistus, kaip paskirta.", helper: "Šio žmogaus MTL yra {ldl}: tai siekia arba viršija 4,9 mmol/l lygį, nuo kurio gairės siūlo pasitarti su gydytoju. Tai verta aptarti su gydytoju, o vaistus toliau vartoti, kaip paskirta." }
  flag_fh_by_total_card:
    en: { self: "Guidelines suggest talking to a doctor when total cholesterol is 7.5 mmol/L or higher. Yours is {total}.", helper: "Guidelines suggest talking to a doctor when total cholesterol is 7.5 mmol/L or higher. Theirs is {total}." }
    lt: { self: "Gairės siūlo pasitarti su gydytoju, kai bendrasis cholesterolis yra 7,5 mmol/l ar daugiau. Jūsų rezultatas: {total}.", helper: "Gairės siūlo pasitarti su gydytoju, kai bendrasis cholesterolis yra 7,5 mmol/l ar daugiau. Šio žmogaus rezultatas: {total}." }
  flag_fh_by_family_card:
    en: { self: "Guidelines suggest checking cholesterol with a doctor when a parent, brother, sister or child had heart disease before 60, or was told they have inherited high cholesterol.", helper: "Guidelines suggest checking cholesterol with a doctor when a parent, brother, sister or child had heart disease before 60, or was told they have inherited high cholesterol." }
    lt: { self: "Gairės siūlo pasitikrinti cholesterolį pas gydytoją, kai vienas iš tėvų, brolis, sesuo ar vaikas iki 60 metų turėjo širdies ligą arba jam buvo pasakyta, kad turi paveldimą didelį cholesterolį.", helper: "Gairės siūlo pasitikrinti cholesterolį pas gydytoją, kai vienas iš tėvų, brolis, sesuo ar vaikas iki 60 metų turėjo širdies ligą arba jam buvo pasakyta, kad turi paveldimą didelį cholesterolį." }
  str_family_may_test:
    en: { self: "If a doctor diagnoses inherited high cholesterol in someone in your family, guidelines recommend testing their close relatives too.", helper: "If a doctor diagnoses inherited high cholesterol in someone in their family, guidelines recommend testing that person's close relatives too." }
    lt: { self: "Jei gydytojas kuriam nors jūsų šeimos nariui nustato paveldimą didelį cholesterolį, gairės rekomenduoja ištirti ir jo artimuosius giminaičius.", helper: "Jei gydytojas kuriam nors šio žmogaus šeimos nariui nustato paveldimą didelį cholesterolį, gairės rekomenduoja ištirti ir jo artimuosius giminaičius." }
  note_ldl_unreliable:
    en: { self: "When triglycerides are above 4.5 mmol/L, the usual way labs calculate LDL cannot be used, so this LDL figure may be less accurate. You could ask about a direct LDL or ApoB test.", helper: "When triglycerides are above 4.5 mmol/L, the usual way labs calculate LDL cannot be used, so this LDL figure may be less accurate. They could ask about a direct LDL or ApoB test." }
    lt: { self: "Kai trigliceridų yra daugiau nei 4,5 mmol/l, įprastu laboratorijos skaičiavimo būdu MTL nustatyti negalima, todėl šis MTL rezultatas gali būti mažiau tikslus. Galite paklausti apie tiesioginį MTL arba ApoB tyrimą.", helper: "Kai trigliceridų yra daugiau nei 4,5 mmol/l, įprastu laboratorijos skaičiavimo būdu MTL nustatyti negalima, todėl šis MTL rezultatas gali būti mažiau tikslus. Galima paklausti apie tiesioginį MTL arba ApoB tyrimą." }
  note_doctor_sets_target:
    en: { self: "You said a doctor has told you about heart disease, stroke, diabetes or kidney disease. Your doctor sets your LDL target.", helper: "You said a doctor has told them about heart disease, stroke, diabetes or kidney disease. Their doctor sets their LDL target." }
    lt: { self: "Nurodėte, kad gydytojas jums yra minėjęs širdies ligą, insultą, diabetą ar inkstų ligą. Jūsų MTL tikslą nustato gydytojas.", helper: "Nurodėte, kad gydytojas šiam žmogui yra minėjęs širdies ligą, insultą, diabetą ar inkstų ligą. Šio žmogaus MTL tikslą nustato gydytojas." }
  note_pregnancy:
    en: { self: "Cholesterol and triglycerides rise in pregnancy. Your midwife or doctor will interpret these results.", helper: "Cholesterol and triglycerides rise in pregnancy. Their midwife or doctor will interpret these results." }
    lt: { self: "Nėštumo metu cholesterolio ir trigliceridų kiekis padidėja. Šiuos rezultatus įvertins jūsų akušerė ar gydytojas.", helper: "Nėštumo metu cholesterolio ir trigliceridų kiekis padidėja. Šiuos rezultatus įvertins jos akušerė ar gydytojas." }
  note_doctor_sets_target_lower_goals:   # OPTIONAL, for QA question 6; sourced by the high/very-high goals in claim_ldl_goals. Not wired in until the clinician answers.
    en: { self: "Guidelines set much lower LDL goals for people with heart disease, stroke or diabetes, often below 1.8 or 1.4 mmol/L. Bring these results to your doctor.", helper: "Guidelines set much lower LDL goals for people with heart disease, stroke or diabetes, often below 1.8 or 1.4 mmol/L. They can bring these results to their doctor." }
    lt: { self: "Žmonėms su širdies liga, po insulto ar su diabetu gairės nustato daug mažesnius MTL tikslus, dažnai mažiau nei 1,8 arba 1,4 mmol/l. Aptarkite šiuos rezultatus su gydytoju.", helper: "Žmonėms su širdies liga, po insulto ar su diabetu gairės nustato daug mažesnius MTL tikslus, dažnai mažiau nei 1,8 arba 1,4 mmol/l. Šiuos rezultatus verta aptarti su gydytoju." }
  str_fasting_fact: { en: "You usually don't need to fast before a cholesterol test.", lt: "Prieš cholesterolio tyrimą paprastai nebūtina būti nevalgius." }
  str_fh_prevalence: { en: "Inherited high cholesterol affects somewhere between 1 in 500 and 1 in 200 people.", lt: "Paveldimas didelis cholesterolis pasitaiko maždaug nuo 1 iš 500 iki 1 iš 200 žmonių." }
  str_why_ldl_matters: { en: "The guidelines rest on large trials in which lowering LDL led to fewer heart attacks and strokes.", lt: "Gairės remiasi dideliais tyrimais, kuriuose sumažinus MTL buvo mažiau infarktų ir insultų." }
  effect_ldl_swap_sat_fat: { en: "Swap butter and lard for plant oils such as rapeseed, sunflower or olive oil. Mainly moves LDL, often 5–10% lower.", lt: "Sviestą ir taukus pakeiskite augaliniais aliejais, pavyzdžiui, rapsų, saulėgrąžų ar alyvuogių. Daugiausia veikia MTL, dažnai jis sumažėja 5–10 %." }
  effect_ldl_oats: { en: "Oats or barley every day. Their fibre lowers LDL a little, by about 3–5% when you eat enough of it.", lt: "Kasdien valgykite avižų ar miežių. Jų skaidulos šiek tiek sumažina MTL, maždaug 3–5 %, kai jų suvalgoma pakankamai." }
  effect_tg_alcohol: { en: "Drink less alcohol. Alcohol has a large effect on triglycerides.", lt: "Gerkite mažiau alkoholio. Alkoholis stipriai veikia trigliceridus." }
  effect_tg_sweet_drinks: { en: "Cut down on sugary drinks and sugar. Guidelines advise this especially when triglycerides are high.", lt: "Mažiau gėrimų su cukrumi ir cukraus. Gairės tai ypač rekomenduoja, kai trigliceridų daug." }
  effect_tg_weight: { en: "If you carry extra weight, losing some lowers triglycerides.", lt: "Jei turite antsvorio, šiek tiek numetus svorio trigliceridų sumažėja." }
  effect_tg_exercise: { en: "Move more, for example brisk walks. Regular exercise lowers triglycerides, on top of any effect from weight loss. It also lowers LDL slightly and raises HDL a little.", lt: "Judėkite daugiau, pavyzdžiui, sparčiai vaikščiokite. Reguliarus fizinis aktyvumas mažina trigliceridus net ir nepriklausomai nuo svorio metimo, šiek tiek sumažina MTL ir šiek tiek padidina DTL." }
  effect_smoking_vessels: { en: "If you smoke, stopping is good for your heart and blood vessels, and may raise HDL a little.", lt: "Jei rūkote, mesti naudinga širdžiai ir kraujagyslėms, be to, gali šiek tiek padidėti DTL." }
  str_supplements_answer: { en: "European guidelines (2025) do not recommend dietary supplements or vitamins for heart health unless they are proven to do no harm and to lower LDL clearly.", lt: "Europos gairės (2025) nerekomenduoja maisto papildų ar vitaminų širdies sveikatai, jei neįrodyta, kad jie nekenkia ir aiškiai mažina MTL." }
  # --- habit option strings added in 2026.3 (LT drafts, not native-checked) ---
  lever_heading: { en: "Options that often help people with results like these", lt: "Galimybės, kurios dažnai padeda žmonėms su tokiais rezultatais" }
  lever_alongside_doctor: { en: "These work alongside a doctor's advice, not instead of it.", lt: "Tai papildo gydytojo patarimus, bet jų nepakeičia." }
  lever_alongside_medicine: { en: "These work alongside prescribed medicine.", lt: "Tai papildo paskirtus vaistus." }
  lever_swap_sat_fat_title: { en: "Swap butter and lard for plant oils", lt: "Sviestą ir taukus keiskite augaliniais aliejais" }
  lever_more_fibre_title: { en: "Eat more fibre: oats, barley, beans and lentils", lt: "Valgykite daugiau skaidulų: avižų, miežių, pupelių ir lęšių" }
  lever_more_fibre_text: { en: "Fibre from oats, barley, beans, lentils, vegetables and wholegrains lowers LDL. Oat and barley fibre lowers it by about 3–5% when you eat enough of it every day.", lt: "Skaidulos iš avižų, miežių, pupelių, lęšių, daržovių ir viso grūdo produktų mažina MTL. Avižų ir miežių skaidulos jį sumažina maždaug 3–5 %, kai jų kasdien suvalgoma pakankamai." }
  lever_avoid_trans_fat_title: { en: "Avoid trans fats and hard margarine", lt: "Venkite transriebalų ir kietojo margarino" }
  lever_avoid_trans_fat_text: { en: "Trans fats raise LDL about as much as saturated fat does, and they also lower HDL. Look for 'partially hydrogenated' on labels.", lt: "Transriebalai MTL padidina maždaug tiek pat, kiek sotieji riebalai, be to, sumažina DTL. Etiketėse ieškokite žodžių „iš dalies hidrinti“." }
  lever_less_alcohol_title: { en: "Drink less alcohol, if you drink", lt: "Gerkite mažiau alkoholio, jei geriate" }
  lever_cut_sweet_drinks_title: { en: "Cut down on sugary drinks and sugar", lt: "Mažiau gėrimų su cukrumi ir cukraus" }
  lever_move_more_title: { en: "Move more, for example brisk walks", lt: "Daugiau judėkite, pavyzdžiui, sparčiai vaikščiokite" }
  lever_lose_weight_title: { en: "Lose some weight, if you carry extra", lt: "Numeskite šiek tiek svorio, jei jo turite per daug" }
  lever_lose_weight_text: { en: "Losing weight lowers triglycerides, lowers LDL a little and raises HDL a little.", lt: "Numetus svorio sumažėja trigliceridų, šiek tiek sumažėja MTL ir šiek tiek padidėja DTL." }
  lever_stop_smoking_title: { en: "Stop smoking, if you smoke", lt: "Meskite rūkyti, jei rūkote" }
  str_retest_no_interval:
    en: { self: "The guidelines we use set no re-test date for lifestyle changes on their own. They say changes may take longer than the 6–8 weeks used for medicine. Pick a date that suits you, ideally with your doctor.", helper: "The guidelines we use set no re-test date for lifestyle changes on their own. They say changes may take longer than the 6–8 weeks used for medicine. Pick a date that suits them, ideally with their doctor." }
    lt: { self: "Mūsų naudojamos gairės nenustato, kada pakartoti tyrimą vien pakeitus gyvenseną. Jose nurodoma, kad pokyčiai gali užtrukti ilgiau nei vaistams taikomos 6–8 savaitės. Pasirinkite jums tinkamą datą, geriausia kartu su gydytoju.", helper: "Mūsų naudojamos gairės nenustato, kada pakartoti tyrimą vien pakeitus gyvenseną. Jose nurodoma, kad pokyčiai gali užtrukti ilgiau nei vaistams taikomos 6–8 savaitės. Datą verta pasirinkti kartu su šio žmogaus gydytoju." }
