# ---------------------------------------------------------------------------
# MARKERS AND GUIDELINE RANGES (same rows draw the bar and, when labels are on, set the status)
# ---------------------------------------------------------------------------
markers:
  - id: ldl
    kind: measured
    names: { en: "LDL cholesterol", lt: "MTL cholesterolis" }
    plausible: { min: 0.3, max: 15 }
    headline: true
    bar_scale: { min: 0, max: 7 }
    zones:
      - { below: 2.6, below_mg_dl: 100, status: usual,   label: zone_ldl_goal_moderate, claim: claim_ldl_goals }
      - { below: 3.0, below_mg_dl: 116, status: work_on, label: zone_ldl_goal_low_only, claim: claim_ldl_goals }
      - { below: 4.9, below_mg_dl: 190, status: work_on, label: zone_ldl_above_goals,   claim: claim_ldl_goals }
      - { from: 4.9,  from_mg_dl: 190,  status: doctor,  label: zone_ldl_doctor,        claim: claim_fh_ldl_threshold }
    guideline_text: str_ldl_guideline
    note: >
      The guideline gives LDL goals by risk group (3.0 low / 2.6 moderate / 1.8 high / 1.4 very high).
      The app cannot assess risk (MDR rule), so the bar shows the two goals for people without known disease
      and says a doctor decides which applies. Cautious default: "usual" (labels on) only below 2.6, not 3.0.
  - id: non_hdl
    kind: calculated
    formula: "total - hdl"
    zones:
      - { below: 3.4, below_mg_dl: 130, status: usual,   label: zone_nonhdl_goal_moderate, claim: claim_nonhdl_goals }
      - { from: 3.4,  from_mg_dl: 130,  status: work_on, label: zone_nonhdl_above,         claim: claim_nonhdl_goals }
    guideline_text: str_nonhdl_guideline
    note: "Guideline gives no non-HDL goal for low risk; 3.4 (moderate) is the highest goal it gives. No doctor zone: no source sets one."
  - id: tg
    kind: measured
    plausible: { min: 0.1, max: 100 }
    bar_scale: { min: 0, max: 12 }
    zones:
      - { below: 1.7, below_mg_dl: 150, status: usual,   label: zone_tg_lower,        claim: claim_tg_lower_risk }
      - { below: 5.6, below_mg_dl: 500, status: work_on, label: zone_tg_above,        claim: claim_tg_lower_risk }
      - { below: 10,  below_mg_dl: 880, status: doctor,  label: zone_tg_doctor_weeks, claim: claim_tg_high_doctor }
      - { from: 10,   from_mg_dl: 880,  status: doctor,  label: zone_tg_doctor_soon,  claim: claim_tg_very_high }
    guideline_text: str_tg_guideline
  - id: hdl
    kind: measured
    sex_specific: false
    zones:
      - { below_or_equal: 1.0, below_or_equal_mg_dl: 40, status: work_on, label: zone_hdl_low_flag,   claim: claim_hdl_flag }
      - { above: 1.0,          above_mg_dl: 40,          status: usual,   label: zone_hdl_above_flag, claim: claim_hdl_flag }
    guideline_text: str_hdl_guideline
    note: "ESC 2019 sets no HDL goal. The EAS/EFLM lab flag is ≤1.0; its Table 5 footnote allows sex-specific cut-offs but gives no number for women. Pass 2: a single 1.0 is the less cautious choice for women. No doctor flag depends on HDL. Open for Justina: keep 1.0 for everyone, or drop the HDL zones and show the value with the no-goal text only."
  - id: total
    kind: measured
    zones:
      - { below: 5.0, below_mg_dl: 190, status: usual,   label: zone_total_below_flag, claim: claim_total_flag }
      - { from: 5.0,  from_mg_dl: 190,  status: work_on, label: zone_total_flag,       claim: claim_total_flag }
      - { from: 7.5,  from_mg_dl: 290,  status: doctor,  label: zone_total_doctor,     claim: claim_fh_total_threshold }
    guideline_text: str_total_guideline
  - id: athero_index
    kind: calculated
    formula: "(total - hdl) / hdl"
    zones: []                        # no stored source sets a range; value shown with explanation only
    guideline_text: str_athero_no_range

# ---------------------------------------------------------------------------
# "TALK TO A DOCTOR" FLAGS (order: doctor_soon, doctor_weeks, info; max 2 cards)
# Every flag has a quote containing its number, plus a cautious_default note where the app's number differs.
# ---------------------------------------------------------------------------
flags:
  - id: tg_very_high
    when: "tg >= 10"
    when_mg_dl: "tg >= 880"
    severity: doctor_soon
    time_frame: str_tf_soon
    card: flag_tg_very_high_card
    blocks_lifestyle_first: true
    claim: claim_tg_very_high
  - id: tg_high
    when: "tg >= 5.6 and tg < 10"
    when_mg_dl: "tg >= 500 and tg < 880"
    severity: doctor_weeks
    time_frame: str_tf_weeks
    card: flag_tg_high_card
    claim: claim_tg_high_doctor
  - id: fh_by_ldl
    when: "ldl >= 4.9 and on_chol_medicine != yes"
    when_mg_dl: "ldl >= 190 and on_chol_medicine != yes"
    severity: doctor_weeks
    time_frame: str_tf_weeks
    card: flag_fh_by_ldl_card
    repeat_before: [options]
    claim: claim_fh_ldl_threshold
  - id: fh_by_ldl_on_medicine
    when: "ldl >= 4.9 and on_chol_medicine == yes"
    when_mg_dl: "ldl >= 190 and on_chol_medicine == yes"
    severity: doctor_weeks
    time_frame: str_tf_weeks
    card: flag_ldl_high_on_medicine_card
    repeat_before: [options]
    claim: claim_fh_ldl_threshold
  - id: fh_by_total
    when: "total >= 7.5 and not flag(fh_by_ldl) and not flag(fh_by_ldl_on_medicine)"
    when_mg_dl: "total >= 290 and not flag(fh_by_ldl) and not flag(fh_by_ldl_on_medicine)"   # 7.5 × 38.67 = 290.0
    severity: doctor_weeks
    time_frame: str_tf_weeks
    card: flag_fh_by_total_card
    repeat_before: [options]
    claim: claim_fh_total_threshold
  - id: fh_by_family
    when: "(family_early_chd == yes or family_known_fh == yes) and not any_flag_of(fh_by_ldl, fh_by_ldl_on_medicine, fh_by_total)"
    severity: doctor_weeks
    time_frame: str_tf_weeks
    card: flag_fh_by_family_card
    repeat_before: [options]
    claim: claim_fh_family
  - id: known_condition
    when: "known_cvd_diabetes_ckd == yes"
    severity: info
    effect: { suppress_status: [ldl, non_hdl] }
    card: note_doctor_sets_target
    claim: claim_ldl_goals
  - id: ldl_calc_unreliable
    when: "tg > 4.5 and ldl != null"
    severity: info
    attach_to: ldl
    card: note_ldl_unreliable
    claim: claim_friedewald
  - id: pregnancy
    when: "pregnant == yes"
    severity: info
    effect: { hide: [plan, options] }
    card: note_pregnancy
    claim: claim_pregnancy

flags_display: { max_cards: 2, overflow: more_to_discuss, order: [doctor_soon, doctor_weeks, info] }

# ---------------------------------------------------------------------------
# CLAIMS
# checks.pass1 = this thread; pass2 = independent check (see evidence/pass2-report.md)
# ---------------------------------------------------------------------------
claims:
  # --- ranges ---
  - id: claim_ldl_goals
    text: [str_ldl_guideline, note_doctor_sets_target_lower_goals]
    sources: [src_esc2019, src_esc2025]
    evidence: guideline
    population: "adults; goals by cardiovascular risk group"
    quotes:
      - { source: src_esc2019, quote: "For individuals at low risk, an LDL-C goal of <3.0 mmol/L (<116 mg/dL) may be considered.", locator: "p. 120, 'What is new' summary", number_in_quote: "3.0" }
      - { source: src_esc2019, quote: "For individuals at moderate risk, an LDL-C goal of <2.6 mmol/L (<100 mg/dL) should be considered.", locator: "p. 120, 'What is new' summary", number_in_quote: "2.6" }
      - { source: src_esc2019, quote: "For patients at high risk, an LDL-C reduction of ≥50% from baseline and an LDL-C goal of <1.8 mmol/L (<70 mg/dL) are recommended.", locator: "p. 120", number_in_quote: "1.8" }
      - { source: src_esc2019, quote: "For secondary prevention in very-high-risk patients, an LDL-C reduction of ≥50% from baseline and an LDL-C goal of <1.4 mmol/L (<55 mg/dL) are recommended.", locator: "p. 120", number_in_quote: "1.4" }
      - { source: src_esc2025, quote: "It is important to note that the LDL-C treatment goals (Figure 1) and therapeutic guidance (Table 4) for persons in each risk category have not changed from the 2019 ESC/EAS Guidelines.", locator: "§3", number_in_quote: null }
    cautious_default: "Bar boundary for 'in the guideline range' set at 2.6 (moderate-risk goal) rather than 3.0, because the app cannot tell who is low risk."

  - id: claim_nonhdl_goals
    text: str_nonhdl_guideline
    sources: [src_esc2019]
    evidence: guideline
    population: "adults; very high / high / moderate risk"
    quotes:
      - { source: src_esc2019, quote: "Non-HDL-C secondary goals are <2.2, 2.6, and 3.4 mmol/L (<85, 100, and 130 mg/dL) for very-high-, high-, and moderate-risk people, respectively.", locator: "Table 7 / §6", number_in_quote: "3.4" }

  - id: claim_tg_lower_risk
    text: str_tg_guideline
    sources: [src_esc2019]
    evidence: guideline
    population: "adults"
    quotes:
      - { source: src_esc2019, quote: "No goal, but <1.7 mmol/L (<150 mg/dL) indicates lower risk and higher levels indicate a need to look for other risk factors.", locator: "Table 7, triglycerides row", number_in_quote: "1.7" }

  - id: claim_hdl_flag
    text: str_hdl_guideline
    sources: [src_eas_eflm2016, src_esc2019]
    evidence: consensus_statement
    population: "adults; lab flag, not a treatment goal"
    quotes:
      - { source: src_eas_eflm2016, quote: "HDL cholesterol ≤1 mmol/L (40 mg/dL)", locator: "Abstract, abnormal concentrations", number_in_quote: "1" }
      - { source: src_esc2019, quote: "To date, no specific goals for HDL-C or TG levels have been determined in clinical trials", locator: "§6", number_in_quote: null }

  - id: claim_total_flag
    text: str_total_guideline
    sources: [src_eas_eflm2016]
    evidence: consensus_statement
    population: "adults; lab flag, not a treatment goal"
    quotes:
      - { source: src_eas_eflm2016, quote: "total cholesterol ≥5 mmol/L (190 mg/dL)", locator: "Abstract, abnormal concentrations", number_in_quote: "5" }

  # --- doctor thresholds ---
  - id: claim_tg_very_high
    text: flag_tg_very_high_card
    sources: [src_esc2019, src_eas_eflm2016]
    evidence: guideline
    population: "adults, any sample"
    quotes:
      - { source: src_esc2019, quote: "The risk of pancreatitis is clinically significant if TGs are >10 mmol/L (880 mg/dL)", locator: "§9.1.4.1", number_in_quote: "10" }
      - { source: src_eas_eflm2016, quote: "Life-threatening concentrations require separate referral when triglycerides >10 mmol/L (880 mg/dL) for the risk of pancreatitis", locator: "Abstract", number_in_quote: "10" }
    cautious_default: "Sources say >10 (880 mg/dL); the app flags at 10 or higher (sends people sooner), and the card says so. Time frame 'today or tomorrow' is in no source: cautious default from design."

  - id: claim_tg_high_doctor
    text: flag_tg_high_card
    sources: [src_acc_aha2018]
    evidence: guideline
    population: "adults, fasting"
    quotes:
      - { source: src_acc_aha2018, quote: "Elevations of chylomicrons typically are present when triglycerides are ≥500 mg/dL (≥5.6 mmol/L), and chylomicronemia may cause acute pancreatitis.", locator: "§4.5.2, supportive text 4", number_in_quote: "5.6" }
      - { source: src_acc_aha2018, quote: "To prevent acute pancreatitis, it is reasonable to reduce triglycerides whenever levels exceed 500 mg/dL (5.6 mmol/L).", locator: "§4.5.2, supportive text 4", number_in_quote: "5.6" }
      - { source: src_eas_eflm2016, quote: "When non-fasting plasma triglyceride concentration >5 mmol/L (440 mg/dL), consideration should be given to repeating the lipid profile in the fasting state", locator: "Table 1, key recommendations", number_in_quote: "5" }
    cautious_default: "Time frame 'in the next few weeks' is in no source: cautious default from design. The 5.6 level is defined on fasting samples; the app applies it to any sample, which flags more people (cautious). The doctor can repeat a fasting test."

  - id: claim_fh_ldl_threshold
    text: flag_fh_by_ldl_card
    sources: [src_acc_aha2018, src_esc2019]
    evidence: guideline
    population: "adults"
    quotes:
      - { source: src_acc_aha2018, quote: "Severe Hypercholesterolemia (LDL-C ≥190 mg/dL [≥4.9 mmol/L])", locator: "§4.2 heading", number_in_quote: "4.9" }
      - { source: src_esc2019, quote: "in people with severely elevated LDL-C [in adults >5 mmol/L (>190 mg/dL), in children >4 mmol/L (>150 mg/dL)], and in first-degree relatives of FH patients.", locator: "§9.1.2.1, p. 150", number_in_quote: "190" }
    cautious_default: "ESC 2019 says >5 mmol/L (>190 mg/dL); AHA/ACC 2018 says ≥4.9 (≥190 mg/dL). The app uses ≥4.9, the lower. The card names no condition."

  - id: claim_fh_total_threshold
    text: flag_fh_by_total_card
    sources: [src_nice_cg71, src_eas2013_fh]
    evidence: guideline
    population: "adults"
    quotes:
      - { source: src_nice_cg71, quote: "a total cholesterol level greater than 7.5 mmol/l", locator: "Recommendation 1.1.1", number_in_quote: "7.5" }
      - { source: src_eas2013_fh, quote: "plasma cholesterol level in an adult ≥8 mmol/L(≥310 mg/dL)", locator: "Abstract", number_in_quote: "8" }
    cautious_default: "NICE says >7.5; EAS 2013 says ≥8. The app uses ≥7.5, the most cautious, and the card says '7.5 or higher' (draft 4). NICE 1.1.1 applies total cholesterol on its own, so the rule also fires when LDL is known and below 4.9 (QA question 3 for the clinician)."

  - id: claim_fh_family
    text: flag_fh_by_family_card
    sources: [src_nice_cg71, src_esc2019]
    evidence: guideline
    population: "adults with a parent, brother, sister or child who had heart disease young, or a relative with known FH"
    quotes:
      - { source: src_nice_cg71, quote: "a personal or family history of premature coronary heart disease (an event before 60 years in an index individual or first-degree relative).", locator: "Recommendation 1.1.1", number_in_quote: "60" }
      - { source: src_esc2019, quote: "in people with relatives with premature fatal or non-fatal CVD", locator: "§9.1.2.1, p. 150", number_in_quote: null }
      - { source: src_esc2019, quote: "and in first-degree relatives of FH patients.", locator: "§9.1.2.1, p. 150", number_in_quote: null }
    note: "Supports the S4 question wording 'before 60' for a parent, brother, sister or child."

  - id: claim_friedewald
    text: note_ldl_unreliable
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "With high TG values (>4.5 mmol/L or >400 mg/dL) the formula cannot be used.", locator: "§5.4.2", number_in_quote: "4.5" }
      - { source: src_esc2019, quote: "ApoB analysis is recommended for risk assessment, particularly in people with high TG levels", locator: "§5 recommendations", number_in_quote: null }

  - id: claim_pregnancy
    text: note_pregnancy
    sources: [src_acc_aha2018]
    evidence: guideline
    quotes:
      - { source: src_acc_aha2018, quote: "Both cholesterol and triglycerides rise with pregnancy", locator: "§4.5.3, women", number_in_quote: null }

  - id: claim_conv_chol
    text: null
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Cholesterol: 1 mmol/L = 38.67 mg/dL.", locator: "Figure 2 caption (SCORE chart)", number_in_quote: "38.67" }

  - id: claim_conv_tg
    text: null
    sources: [src_acc_aha2018]
    evidence: guideline
    quotes:
      - { source: src_acc_aha2018, quote: "To convert to mmol/L, the values in mg/dL for TC, LDL-C, HDL-C, and non–HDL-C were divided by 38.6 and for triglycerides, by 88.6.", locator: "§1.1 methods, PDF p. 5 (applies to the whole guideline)", number_in_quote: "88.6" }
    note: "No stored source states 88.57. Using 88.6 changes a converted value by under 0.05%."

  - id: claim_non_fasting
    text: str_fasting_fact
    sources: [src_eas_eflm2016, src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "For general risk screening, non-fasting samples seem to have at least the same prognostic value as fasting samples.", locator: "§5.4.3", number_in_quote: null }
      - { source: src_eas_eflm2016, quote: "Fasting is not routinely required for determination of a lipid profile", locator: "Title", number_in_quote: null }

  - id: claim_fh_prevalence
    text: str_fh_prevalence
    sources: [src_eas2013_fh]
    evidence: consensus_statement
    quotes:
      - { source: src_eas2013_fh, quote: "Based on prevalences between 1/500 and 1/200, between 14 and 34 million individuals worldwide have FH.", locator: "Abstract", number_in_quote: "1/200" }
    note: "General 'Why might it be high?' screen only, never next to a person's numbers (QA A3). Not a lab threshold, so under the strict rule this needs Justina's OK on consensus statements, or it is dropped."

  - id: claim_ldl_events
    text: str_why_ldl_matters
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "for each 1 mmol/L reduction in LDL-C, statin/more statin reduced major vascular events (MI, CAD death, or any stroke or coronary revascularization) by 22%", locator: "§8.1, CTT meta-analysis", number_in_quote: "22%" }
    note: "Statin trials. Shown without a number and never on habit screens (QA)."

  # --- habit option cards ---
  - id: claim_satfat_ldl
    text: effect_ldl_swap_sat_fat
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Reduce dietary saturated fats", locator: "Table 8, 'reduce TC and LDL-C' block: ++, level A", number_in_quote: null }
      - { source: src_esc2019, quote: "The magnitude of the effect (+++ = >10%, ++ = 5–10%, + = <5%)", locator: "Table 8 footnote", number_in_quote: "5–10%" }
      - { source: src_esc2019, quote: "Unsaturated fat-rich oils from safflower, sunflower, rapeseed, flaxseed, corn, olives, or soybean were shown to reduce LDL-C levels (-0.42 to -0.20 mmol/L) when used in substitution of SFA-rich foods like butter or lard.", locator: "§7.1", number_in_quote: "0.42" }
    note: "'LDL often 5–10% lower' is back: ESC Table 8 rates this change '++' = 5–10%. Hooper 2020 no longer needed."

  - id: claim_fibre_ldl
    text: effect_ldl_oats
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Available evidence consistently demonstrates a TC- and LDL-C-lowering effect of β-glucan, a viscous fibre from oat and barley.", locator: "§7.5.3", number_in_quote: null }
      - { source: src_esc2019, quote: "the dosage needed to achieve a clinically relevant reduction in levels of LDL-C of 3–5% varies from 3–10 g per day according to the specific type of fibre.", locator: "§7.5.3", number_in_quote: "3–5%" }
    note: "Replaces Whitehead 2014 (no stored copy) as the carrying source. The 3–5% applies to oat and barley (β-glucan) fibre at 3–10 g a day; the cards say so."

  - id: claim_alcohol_tg
    text: effect_tg_alcohol
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Alcohol intake has a [...] major impact on TG levels, particularly in individuals with HTG.", locator: "§7.2 (crosses page 134 to 135)", number_in_quote: null }
      - { source: src_esc2019, quote: "Reduce alcohol intake", locator: "Table 8, 'reduce TG' block: +++ (>10%), level A", number_in_quote: null }

  - id: claim_sugar_tg
    text: effect_tg_sweet_drinks
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Soft drinks should be used with moderation by the general population, and should be drastically limited in those individuals with elevated TG values or visceral adiposity.", locator: "§7.4.3", number_in_quote: null }
      - { source: src_esc2019, quote: "Reduce intake of mono- and disaccharides", locator: "Table 8, 'reduce TG' block: ++, level B", number_in_quote: null }

  - id: claim_weight_tg
    text: effect_tg_weight
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Weight reduction improves insulin sensitivity and decreases TG levels.", locator: "§7.2", number_in_quote: null }

  - id: claim_exercise_tg_hdl
    text: effect_tg_exercise
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Regular physical exercise reduces plasma TG levels over and above the effect of weight reduction.", locator: "§7.2", number_in_quote: null }
      - { source: src_esc2019, quote: "Increase habitual physical activity", locator: "Table 8, 'reduce TC and LDL-C' block: + (<5%), level B", number_in_quote: null }
      - { source: src_esc2019, quote: "Aerobic physical activity, such as 25–30 km of brisk walking per week (or any equivalent activity), may increase HDL-C levels by 0.08–0.15 mmol/L (3.1–6 mg/dL).", locator: "§7.3", number_in_quote: "0.08–0.15" }

  - id: claim_smoking
    text: effect_smoking_vessels
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Smoking cessation has clear benefits regarding overall CV risk, and specifically on HDL-C levels.", locator: "§7.4.5", number_in_quote: null }
      - { source: src_esc2019, quote: "Smoking cessation may also contribute to HDL-C elevation, provided that weight gain is prevented.", locator: "§7.3", number_in_quote: null }

  - id: claim_supplements
    text: str_supplements_answer
    sources: [src_esc2025]
    evidence: guideline
    quotes:
      - { source: src_esc2025, quote: "Dietary supplements or vitamins without documented safety and significant LDL-C-lowering efficacy are not recommended to lower the risk of [...] ASCVD.", locator: "Recommendation Table 8 (Class III, Level B; class/level cells interrupt the text)", number_in_quote: null }

  - id: claim_family_testing
    text: str_family_may_test
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Once the index case is diagnosed, family cascade screening is recommended.", locator: "§9.1.2.1, p. 150", number_in_quote: null }
    note: "Supports testing relatives only once a doctor has diagnosed inherited high cholesterol in a family member (pass 2 fix)."


  # --- habit option claims added in 2026.3 ---
  - id: claim_transfat
    text: lever_avoid_trans_fat_text
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Quantitatively, dietary trans fatty acids have a similar elevating effect on LDL-C to that of SFAs; however, while SFAs increase HDL-C levels, trans fats decrease them.", locator: "§7.1", number_in_quote: null }
      - { source: src_esc2019, quote: "Avoid dietary trans fats", locator: "Table 8: ++ (5–10%) level A for LDL-C, ++ level A for HDL-C", number_in_quote: null }
      - { source: src_esc2019, quote: "‘Partially hydrogenated fatty acids’ of industrial origin represent the major source of trans fatty acids in the diet", locator: "§7.1", number_in_quote: null }
      - { source: src_esc2019, quote: "Trans fats and hard margarines", locator: "Table 9, cooking fat row, column 'to be chosen occasionally in limited amounts', marked '(better to avoid them)'", number_in_quote: null }

  - id: claim_fibre_foods
    text: lever_more_fibre_text
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Dietary fibre (particularly of the soluble type)—which is present in legumes, fruits, vegetables, and wholegrain cereals (e.g. oats and barley)—has a hypocholesterolaemic effect", locator: "§7.4.3", number_in_quote: null }
      - { source: src_esc2019, quote: "Increase dietary fibre", locator: "Table 8: ++ (5–10%) level A for LDL-C", number_in_quote: null }
    note: "The 3–5% shown on the card comes from claim_fibre_ldl (§7.5.3, at 3–10 g fibre a day). Table 8's '++' is the broader 'increase dietary fibre'; the card uses the smaller, more specific figure so oats are not overstated (QA A4)."

  - id: claim_weight_lipids
    text: lever_lose_weight_text
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Weight reduction increases HDL-C levels; a 0.01 mmol/L (0.4 mg/dL) increase is observed for every kilogram decrease in body weight when weight reduction has stabilized.", locator: "§7.3", number_in_quote: "0.01" }
      - { source: src_esc2019, quote: "Body weight reduction also influences TC and LDL-C levels, but the magnitude of the effect is small", locator: "§7.1", number_in_quote: null }
      - { source: src_esc2019, quote: "Reduce excessive body weight", locator: "Table 8: LDL-C ++ A; TG + A; HDL-C ++ A", number_in_quote: null }

  - id: claim_retest_interval
    text: str_retest_no_interval
    sources: [src_esc2019]
    evidence: guideline
    quotes:
      - { source: src_esc2019, quote: "Response to therapy can be assessed at 6–8 weeks from initiation of therapy, but response to lifestyle may take longer.", locator: "§11", number_in_quote: "6–8" }
      - { source: src_esc2019, quote: "Recommendations stem from consensus rather than evidence-based medicine.", locator: "§11", number_in_quote: null }
      - { source: src_acc_aha2018, quote: "Adherence to changes in lifestyle and effects of LDL-C–lowering medication should be assessed by measurement of fasting lipids and appropriate safety indicators 4 to 12 weeks after statin initiation or dose adjustment", locator: "§4.4.3, COR I, LOE A", number_in_quote: "4 to 12" }
    note: >
      No stored source sets a re-test interval for lifestyle change. ESC's 8 (±4) weeks and AHA/ACC's 4–12 weeks
      are for after starting or changing medicine (AHA/ACC names lifestyle too, but its clock starts at the statin). The only
      lifestyle-only window, AHA/ACC's "3 to 6 months of lifestyle therapy", is for children with very high LDL before a
      statin decision, not an adult re-test. ESC says lifestyle response "may take longer". So the pack sets no
      interval: the person picks their own date (ideally with their doctor). The date picker starts empty, with
      no pre-filled suggestion (QA LV1).

  # --- still not shippable ---
  - id: claim_test_variation
    text: str_before_after_variation
    status: blocked_no_quote
    note: "No stored source gives a number for test-to-test variation. Before/after shows numbers and the difference only."

# ---------------------------------------------------------------------------
# HABIT OPTIONS (levers), added in 2026.3. Shape per architect.md §4; QA M2: order depends ONLY on which markers
# are outside their guideline range, then evidence type, then effort. Questionnaire answers never change order.
# total (QA O2): Table 8 rates TC and LDL-C together ('Lifestyle interventions to reduce TC and LDL-C levels'), so each
# LDL-lowering lever carries the same rating for total cholesterol.
# magnitude = ESC 2019 Table 8 rating for that marker (+ <5%, ++ 5–10%, +++ >10%), shown to nobody, used only to
# break ties within the same marker. Excluded on purpose (QA §15.2): Mediterranean-diet event %, portfolio diet,
# sleep and stress, supplements, phytosterol-enriched foods and red yeast rice (product/supplement-like).
# ---------------------------------------------------------------------------
levers:
  - id: swap_sat_fat
    helps: { ldl: "++", total: "++", non_hdl: "++", tg: "+" }     # tg: Table 8 'Replace saturated fats with mono- or polyunsaturated fats' + B
    evidence: guideline
    effort: small
    title: lever_swap_sat_fat_title
    text: effect_ldl_swap_sat_fat
    claim: claim_satfat_ldl
  - id: more_fibre
    helps: { ldl: "++", total: "++", non_hdl: "++" }
    evidence: guideline
    effort: small
    title: lever_more_fibre_title
    text: lever_more_fibre_text
    claim: [claim_fibre_ldl, claim_fibre_foods]
  - id: avoid_trans_fat
    helps: { ldl: "++", total: "++", non_hdl: "++", hdl: "++" }
    evidence: guideline
    effort: small
    title: lever_avoid_trans_fat_title
    text: lever_avoid_trans_fat_text
    claim: claim_transfat
  - id: less_alcohol
    helps: { tg: "+++" }
    evidence: guideline
    effort: small
    title: lever_less_alcohol_title
    text: effect_tg_alcohol
    claim: claim_alcohol_tg
  - id: cut_sweet_drinks
    helps: { tg: "++" }
    evidence: guideline
    effort: small
    title: lever_cut_sweet_drinks_title
    text: effect_tg_sweet_drinks
    claim: claim_sugar_tg
  - id: move_more
    helps: { tg: "++", hdl: "+++", ldl: "+", total: "+", non_hdl: "+" }
    evidence: guideline
    effort: medium
    title: lever_move_more_title
    text: effect_tg_exercise
    claim: claim_exercise_tg_hdl
  - id: lose_weight
    # QA LV4: ldl "+" because §7.1 says the LDL effect "is small"
    helps: { ldl: "+", total: "+", non_hdl: "++", tg: "+", hdl: "++" }
    evidence: guideline
    effort: large
    title: lever_lose_weight_title
    text: lever_lose_weight_text
    claim: [claim_weight_lipids, claim_weight_tg]
  - id: stop_smoking
    helps: { hdl: "+" }
    evidence: guideline
    effort: large
    title: lever_stop_smoking_title
    text: effect_smoking_vessels
    claim: claim_smoking
levers_config:
  ordering: "1. levers helping a marker outside its guideline range, markers in fixed order tg (doctor zones) > ldl > total > non_hdl > tg > hdl; 2. higher Table 8 magnitude for that marker; 3. effort small > medium > large"
  use_answers: false
  show_only_when_out_of_range: [ldl, non_hdl, total, tg]   # QA LV5: HDL alone never brings up options (ESC sets no HDL goal)
  rank_last: [avoid_trans_fat]        # QA LV2: within every marker, after all other options. EU Regulation 2019/649 caps industrial trans fat
                                      # (2 g per 100 g fat, since April 2021), so it rarely applies in Lithuania. Ranking note only; not shown to users.
  show: { min: 3, max: 5 }
  never_offer: [supplements]
  heading: lever_heading
  note_with_doctor_flag: lever_alongside_doctor
  note_on_medicine: lever_alongside_medicine
  note: "Supplements: answered on request only by str_supplements_answer (claim_supplements)."

retest:
  interval_weeks: null                # no source sets one for lifestyle change (claim_retest_interval)
  person_picks_date: true
  suggested_weeks: null               # QA LV1: no pre-filled date; the picker starts empty
  text: str_retest_no_interval

