# Blood Lipids Explained: content pack (rules + claims), schema per roles/architect.md §4, §15, §16.2, §17
# Owner of this folder: evidence thread ("Evidence pass: ranges and sources"). Other threads read, never write.
#
# STATUS: APPROVED 2026.3 (Justina, 2026-10-09; content of 2026.3-draft.3). Supersedes 2026.1; includes the 2026.2-draft.1
# additions plus habit options (`levers`) and the re-test interval finding. LT strings are drafts (lt_native_review: false).
# Signed = canary passed + both AI passes agree + every quote matches its stored source copy + Justina approves.
#
# Evidence standard: the architect's stricter bar (decisions.md, architect.md §15): a current major clinical
# guideline, or a systematic review / meta-analysis of randomised trials. EFSA health claims carry no claim.
# Judgement call flagged for Justina: consensus statements written by the guideline societies (EAS; EAS+EFLM)
# are accepted for LAB THRESHOLDS ONLY, never for lifestyle effects. In draft 2 every doctor threshold also has
# a guideline quote, so the consensus statements are supporting sources only.
#
# Quotes: copied from the stored PDFs in evidence/sources/ and written as the typeset page reads (≥, ≤, +, –).
# PDF text extraction renders some symbols differently (ESC: "≥"→">_", "+"→"þ", en dash dropped;
# EAS: ">"→".", "<"→","). evidence/verify_quotes.py maps these and reports each quote as EXACT (after the map)
# or ALNUM (letters and digits match in order). quote_status records the result of the last run.

manifest:
  version: "2026.3"
  released: 2026-10-09
  approved_by: Justina             # covers every claim, zone, flag, lever and string in this file
  approved_date: 2026-10-09
  approval_record: "Justina, evidence thread 2026-10-09 04:30 UTC: 'Yes' to approving 2026.3 (draft 3), which includes all of 2026.2-draft.1"
  supersedes: "2026.1"
  reviewed_by_clinician: null       # set only if the volunteer clinician reads the red-flag page
  languages: [en, lt]
  lt_native_review: false           # LT strings are DRAFTS by the evidence thread, not checked by a native speaker (open item for Justina)
  evidence_standard: "guideline_or_sr_of_rcts (architect); society consensus statements for lab thresholds only"
  sources_list: evidence/sources.md
  canary: evidence/canary.yaml

display:
  status_labels: false              # pilot default until VASPVT answers (Justina, 2026-10-07)

units:
  # Pass 2: sources rounded their mg/dL figures with 38.6 and 88, so a value typed in mg/dL is compared with the
  # source's own mg/dL cut-off (zones *_mg_dl and flags when_mg_dl).
  # Draft 4 (QA edge case: TG 497 mg/dL = 5.61 mmol/L missed the 500 mg/dL edge but 5.61 mmol/L flags):
  # a value typed in mg/dL takes the MORE CAUTIOUS of the two readings. A flag fires, and the more serious zone
  # is shown, if EITHER the mg/dL cut-off OR the converted mmol/L cut-off is crossed. Same rule for every marker.
  mg_dl_rule: either_cut_off_more_cautious
  chol_mg_dl_per_mmol: 38.67        # claim_conv_chol (ESC 2019)
  tg_mg_dl_per_mmol: 88.6           # claim_conv_tg (AHA/ACC 2018). Architect/QA had 88.57, which no source states.
  thresholds_in_entered_unit: true  # see flags[].when_mg_dl: a value typed as 880 mg/dL TG converts to 9.93 mmol/L
                                    # and would miss the ≥10 flag; the source's own mg/dL figure is checked too.

